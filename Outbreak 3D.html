<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06090f;font-family:system-ui,sans-serif;color:#cfe;touch-action:none}
canvas{display:block}

#bar{flex:1;height:12px;background:#2a1111;border-radius:6px;overflow:hidden}
#hp{height:100%;width:100%;background:#d33}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px #a00;opacity:0}
#toast{position:fixed;top:60px;right:14px;text-align:right;color:#fd4;font-weight:700;pointer-events:none}

h2{margin:18px 0 6px;color:#9db}
p{max-width:460px;line-height:1.45;margin:6px}
.money{font-size:24px;color:#fd4;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%;max-width:760px}
.card{padding:12px;border:1px solid #2c5a3a;border-radius:10px;background:#0f2a1a;color:#cfe;font-size:15px;cursor:pointer}
.card:hover:not([disabled]){background:#17432a}
.card[disabled]{opacity:.35;cursor:not-allowed}
small{color:#8ab}
#ab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);gap:10px;z-index:2;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
#ab button{width:50px;height:50px;border-radius:50%;border:2px solid #4c4;background:#0f2a1acc;color:#cfe;font-weight:700;font-size:18px}
